# electron-builder config of do•doc, used by `npm run electron:dist` (adc-electron dist).
# Shared settings (asar, files, output in electron/dist, Electron version) come
# from adc-core. Paths are relative to the app root.
extends: node_modules/adc-core/electron/builder.base.yml

appId: "dodoc"
productName: "do•doc"

extraMetadata:
  # Linux: Electron uses this as window app_id / WM_CLASS, so KDE/GNOME can match
  # running windows to dodoc.desktop (name + icon). Must be ASCII.
  desktopName: dodoc.desktop

dmg:
  writeUpdateInfo: false

win:
  artifactName: dodoc-${version}-windows.${ext}
  icon: electron/build/icon.png
  target:
    - target: nsis
      arch: [x64]
    # appx target for Windows Store - use npm run electron:dist-win-store to build separately

nsis:
  oneClick: true
  uninstallDisplayName: "do•doc ${version}"
  createDesktopShortcut: always
  shortcutName: "do•doc"
  # do not create blockmap
  differentialPackage: false

appx:
  applicationId: "AtelierDesChercheurs.DoDoc"
  displayName: "do•doc"
  publisherDisplayName: "L'Atelier des Chercheurs"
  # Replace these with actual values from Microsoft Partner Center:
  # Go to Partner Center > Your App > Product Identity
  identityName: "dodoc" # Package/Identity name from Partner Center
  publisher: "CN=21DC51D1-C93D-4F1C-8596-0ADF25BB5216" # Publisher from Partner Center
  backgroundColor: "#ffffff"
  languages: ["en-US", "fr-FR", "it-IT"]
  showNameOnTiles: true
  electronUpdaterAware: false
  setBuildNumber: true
  # Note: Capabilities are automatically set by electron-builder based on your app's needs
  # If you need custom capabilities, you'll need to provide a custom appxmanifest.xml template

mac:
  artifactName: dodoc-${version}-macos.${ext}
  category: public.app-category.education
  icon: electron/build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: true
  entitlements: electron/build/entitlements.mac.plist
  entitlementsInherit: electron/build/entitlements.mac.plist
  notarize: true
  #provisioningProfile: dodoc.provisionprofile
  extendInfo:
    NSMicrophoneUsageDescription: Merci d'accorder l'accès au micro pour réaliser des enregistrements.
    NSCameraUsageDescription: Merci d'accorder l'accès à la caméra pour réaliser des enregistrements.
    NSScreenCaptureDescription: Merci d'accorder l'accès à l'affichage pour réaliser des enregistrements.

linux:
  artifactName: dodoc-${version}-linux-${arch}.${ext}
  # AppImage rejects "•" in productFilename, which defaults to productName
  executableName: dodoc
  syncDesktopName: true
  target:
    - target: deb
      arch:
        - x64
        - arm64
    - target: AppImage
      arch:
        - x64
        - arm64
  category: Education
  icon: electron/build/icons
  executableArgs:
    - '--js-flags="--max-old-space-size=4096"'
  desktop:
    entry:
      Name: do•doc
      Comment: A documentation tool for creativity.
      Terminal: false
      Categories: Education;AudioVideo;Graphics;

appImage:
  synopsis: A documentation tool for creativity.
  category: Education
