name: Platform paths

# adc-core's paths.js replaced the native platform-folders package: check on
# each OS that both give the same documents and cache folders, since the
# documents folder decides where existing content is found.

on:
  workflow_dispatch:
  push:
    paths:
      - "packages/adc-core/server/paths.js"
      - "scripts/compare-platform-folders.js"
      - ".github/workflows/platform-paths.yml"
  pull_request:
    paths:
      - "packages/adc-core/server/paths.js"
      - "scripts/compare-platform-folders.js"
      - ".github/workflows/platform-paths.yml"

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      # paths.js only uses Node built-ins: the repo dependencies are not needed
      - name: Install platform-folders, outside the repo
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/pf" platform-folders@0.6.1

      - name: Compare
        shell: bash
        run: node scripts/compare-platform-folders.js "$RUNNER_TEMP/pf/node_modules/platform-folders"

      # as root, HOME is ignored and the passwd home directory is used
      - name: Compare, as root
        if: runner.os == 'Linux'
        shell: bash
        run: sudo env "HOME=$HOME" "$(command -v node)" scripts/compare-platform-folders.js "$RUNNER_TEMP/pf/node_modules/platform-folders"

      # a Documents folder redirected elsewhere (as with OneDrive), with accents
      - name: Compare, with a redirected Documents folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:USERPROFILE "Dossiér Tést"
          New-Item -ItemType Directory -Force $target | Out-Null
          Set-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders" -Name Personal -Value $target
          node scripts/compare-platform-folders.js "$env:RUNNER_TEMP\pf\node_modules\platform-folders" --expect-documents $target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
