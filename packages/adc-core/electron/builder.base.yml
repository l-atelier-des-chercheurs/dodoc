# electron-builder settings shared by adc-core apps. An app's
# electron/electron-builder.yml starts with
#   extends: node_modules/adc-core/electron/builder.base.yml
# and adds its own identity (appId, productName, icons, targets…).
# Paths are relative to the app root. `files` lists are merged, other keys
# from the app override these.
# electronVersion is passed by `adc-electron dist`, from ./package.json.

asar: true
asarUnpack:
  - "content/**"
  - "client/dist/**"
  - "node_modules/sharp"
  - "node_modules/@img"
  # not needed, only useful in the web version (js modules, while website export uses a bundle)
  - "!client/dist/assets/**"

directories:
  output: electron/dist
  buildResources: electron/build

# Exclude problematic directories to prevent pattern length issues
files:
  - "**/*"
  - "!client/node_modules/**"
  - "!electron/dist/**"
  # adc-core is a workspace: it is already copied into node_modules/adc-core
  - "!packages/**"
  # Electron itself and its build tools, see ./package.json
  - "!node_modules/adc-core/electron/node_modules/**"
  - "!node_modules/puppeteer/**"
  - "!node_modules/puppeteer-core/**"
  - "!node_modules/chromium-bidi/**"
  - "!node_modules/devtools-protocol/**"
  - "!node_modules/typescript/**"
  - "!node_modules/@types/**"
  - "!settings.json"
  - "!**/*.log"
  - "!**/.DS_Store"
  - "!.git/**"
  - "!dist/**"
